<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(96, 32)">
    <!-- Feather part -->
    <path d="M160,32 
             C160,32 240,64 240,160 
             C240,256 160,352 160,416
             M160,32
             C160,32 80,64 80,160
             C80,256 160,352 160,416"
          fill="none" 
          stroke="currentColor" 
          stroke-width="24"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Circuit board lines and dots -->
    <g stroke="currentColor" stroke-width="16">
      <!-- Right side traces -->
      <line x1="240" y1="160" x2="320" y2="160" />
      <line x1="260" y1="200" x2="340" y2="200" />
      <line x1="260" y1="240" x2="340" y2="240" />
      <line x1="260" y1="280" x2="340" y2="280" />
      <line x1="260" y1="320" x2="340" y2="320" />
      
      <!-- Dots at the end of traces -->
      <circle cx="320" cy="160" r="8" fill="currentColor"/>
      <circle cx="340" cy="200" r="8" fill="currentColor"/>
      <circle cx="340" cy="240" r="8" fill="currentColor"/>
      <circle cx="340" cy="280" r="8" fill="currentColor"/>
      <circle cx="340" cy="320" r="8" fill="currentColor"/>
    </g>
    
    <!-- Pen nib -->
    <path d="M120,416 L200,416 L160,368 Z" 
          fill="currentColor"
          stroke="currentColor"
          stroke-width="16"
          stroke-linejoin="round"/>
  </g>
</svg>
