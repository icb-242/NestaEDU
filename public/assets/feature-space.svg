<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#F9FAFB"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="28" font-weight="bold" fill="#1F2937">Feature Space Visualization</text>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#6B7280">Each point is an example, positioned by its features</text>
  
  <!-- Axes -->
  <line x1="100" y1="500" x2="700" y2="500" stroke="#9CA3AF" stroke-width="2"/>
  <line x1="100" y1="500" x2="100" y2="100" stroke="#9CA3AF" stroke-width="2"/>
  
  <!-- Axis labels -->
  <text x="400" y="535" text-anchor="middle" font-size="14" font-weight="600" fill="#4B5563">Feature 1 (e.g., size)</text>
  <text x="60" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#4B5563" transform="rotate(-90, 60, 300)">Feature 2 (e.g., color intensity)</text>
  
  <!-- Cluster 1: Cats (Blue) - Top left -->
  <g id="cluster-cats">
    <ellipse cx="250" cy="200" rx="80" ry="70" fill="#3B82F6" opacity="0.1" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Data points (cats) -->
    <circle cx="220" cy="180" r="8" fill="#3B82F6"/>
    <circle cx="260" cy="190" r="8" fill="#3B82F6"/>
    <circle cx="240" cy="210" r="8" fill="#3B82F6"/>
    <circle cx="270" cy="220" r="8" fill="#3B82F6"/>
    <circle cx="230" cy="230" r="8" fill="#3B82F6"/>
    <circle cx="250" cy="170" r="8" fill="#3B82F6"/>
    <circle cx="280" cy="200" r="8" fill="#3B82F6"/>
    <circle cx="235" cy="195" r="8" fill="#3B82F6"/>
    
    <!-- Label -->
    <text x="250" y="155" text-anchor="middle" font-size="16" font-weight="bold" fill="#3B82F6">🐱 Cats</text>
  </g>
  
  <!-- Cluster 2: Dogs (Green) - Bottom right -->
  <g id="cluster-dogs">
    <ellipse cx="550" cy="400" rx="90" ry="75" fill="#10B981" opacity="0.1" stroke="#10B981" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Data points (dogs) -->
    <circle cx="520" cy="380" r="8" fill="#10B981"/>
    <circle cx="560" cy="390" r="8" fill="#10B981"/>
    <circle cx="540" cy="410" r="8" fill="#10B981"/>
    <circle cx="580" cy="420" r="8" fill="#10B981"/>
    <circle cx="530" cy="430" r="8" fill="#10B981"/>
    <circle cx="550" cy="370" r="8" fill="#10B981"/>
    <circle cx="590" cy="400" r="8" fill="#10B981"/>
    <circle cx="535" cy="395" r="8" fill="#10B981"/>
    <circle cx="570" cy="415" r="8" fill="#10B981"/>
    
    <!-- Label -->
    <text x="550" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#10B981">🐕 Dogs</text>
  </g>
  
  <!-- Cluster 3: Birds (Purple) - Top right -->
  <g id="cluster-birds">
    <ellipse cx="580" cy="220" rx="75" ry="65" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Data points (birds) -->
    <circle cx="560" cy="200" r="8" fill="#8B5CF6"/>
    <circle cx="590" cy="215" r="8" fill="#8B5CF6"/>
    <circle cx="575" cy="235" r="8" fill="#8B5CF6"/>
    <circle cx="600" cy="240" r="8" fill="#8B5CF6"/>
    <circle cx="565" cy="225" r="8" fill="#8B5CF6"/>
    <circle cx="585" cy="195" r="8" fill="#8B5CF6"/>
    <circle cx="605" cy="220" r="8" fill="#8B5CF6"/>
    
    <!-- Label -->
    <text x="580" y="175" text-anchor="middle" font-size="16" font-weight="bold" fill="#8B5CF6">🐦 Birds</text>
  </g>
  
  <!-- Decision boundaries (curved lines separating clusters) -->
  <path d="M 350 150 Q 420 280 480 320" stroke="#EF4444" stroke-width="3" stroke-dasharray="8,4" fill="none"/>
  <path d="M 330 280 Q 380 350 450 450" stroke="#EF4444" stroke-width="3" stroke-dasharray="8,4" fill="none"/>
  
  <!-- New data point (unknown) -->
  <g id="new-point">
    <circle cx="400" cy="300" r="12" fill="#F59E0B" stroke="#FBBF24" stroke-width="3"/>
    <text x="400" y="307" text-anchor="middle" font-size="16" fill="white">?</text>
    
    <!-- Arrow and label -->
    <line x1="400" y1="260" x2="400" y2="285" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>
    <text x="400" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#F59E0B">New Example</text>
  </g>
  
  <!-- Explanation boxes -->
  <g id="explanation-1" transform="translate(100, 550)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="90" y="15" text-anchor="middle" font-size="11" font-weight="600" fill="#1E40AF">1. Points = Examples</text>
    <text x="90" y="30" text-anchor="middle" font-size="10" fill="#1E40AF">Each dot is one data point</text>
  </g>
  
  <g id="explanation-2" transform="translate(310, 550)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="90" y="15" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">2. Clusters = Groups</text>
    <text x="90" y="30" text-anchor="middle" font-size="10" fill="#065F46">Similar items group together</text>
  </g>
  
  <g id="explanation-3" transform="translate(520, 550)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="90" y="15" text-anchor="middle" font-size="11" font-weight="600" fill="#991B1B">3. Boundaries = Decisions</text>
    <text x="90" y="30" text-anchor="middle" font-size="10" fill="#991B1B">Lines separate classes</text>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#F59E0B"/>
    </marker>
  </defs>
</svg>

