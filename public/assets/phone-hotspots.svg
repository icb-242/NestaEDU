<svg viewBox="0 0 200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Phone outline -->
  <rect x="20" y="20" width="160" height="360" rx="20" ry="20" fill="#1f2937" stroke="#374151" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="30" y="50" width="140" height="300" rx="10" ry="10" fill="#111827"/>
  
  <!-- Screen bezel -->
  <rect x="25" y="45" width="150" height="310" rx="15" ry="15" fill="none" stroke="#4b5563" stroke-width="1"/>
  
  <!-- Home button -->
  <circle cx="100" cy="370" r="8" fill="#6b7280"/>
  
  <!-- Simple app icons represented as circles -->
  <!-- Camera area (top right) -->
  <circle cx="140" y="80" r="12" fill="#3b82f6" opacity="0.3"/>
  <circle cx="140" y="80" r="6" fill="#3b82f6"/>
  
  <!-- Keyboard area (bottom center) -->
  <rect x="80" y="320" width="40" height="20" rx="4" fill="#10b981" opacity="0.3"/>
  <rect x="85" y="325" width="30" height="10" rx="2" fill="#10b981"/>
  
  <!-- Maps area (left side) -->
  <circle cx="60" y="200" r="12" fill="#f59e0b" opacity="0.3"/>
  <circle cx="60" y="200" r="6" fill="#f59e0b"/>
</svg>



