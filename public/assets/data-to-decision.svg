<svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="200" fill="#f8fafc"/>
  
  <!-- Data step -->
  <g transform="translate(50, 50)">
    <rect width="100" height="100" rx="10" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="50" cy="30" r="8" fill="#3b82f6"/>
    <circle cx="30" cy="50" r="6" fill="#3b82f6" opacity="0.7"/>
    <circle cx="70" cy="50" r="6" fill="#3b82f6" opacity="0.7"/>
    <circle cx="50" cy="70" r="6" fill="#3b82f6" opacity="0.7"/>
    <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3b82f6">Data</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M 170 100 L 210 100" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Train step -->
  <g transform="translate(240, 50)">
    <rect width="100" height="100" rx="10" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="2"/>
    <!-- Neural network nodes -->
    <circle cx="30" cy="30" r="4" fill="#10b981"/>
    <circle cx="50" cy="30" r="4" fill="#10b981"/>
    <circle cx="70" cy="30" r="4" fill="#10b981"/>
    <circle cx="40" cy="50" r="4" fill="#10b981"/>
    <circle cx="60" cy="50" r="4" fill="#10b981"/>
    <circle cx="50" cy="70" r="4" fill="#10b981"/>
    <!-- Connections -->
    <line x1="30" y1="30" x2="40" y2="50" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="50" y1="30" x2="40" y2="50" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="70" y1="30" x2="60" y2="50" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="40" y1="50" x2="50" y2="70" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <line x1="60" y1="50" x2="50" y2="70" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981">Train</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M 360 100 L 400 100" stroke="#6b7280" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Predict step -->
  <g transform="translate(430, 50)">
    <rect width="100" height="100" rx="10" fill="#f59e0b" opacity="0.1" stroke="#f59e0b" stroke-width="2"/>
    <!-- Prediction chart -->
    <rect x="20" y="40" width="60" height="40" fill="#f59e0b" opacity="0.3"/>
    <polygon points="20,80 40,60 60,70 80,50" fill="#f59e0b"/>
    <text x="50" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Predict</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
</svg>



