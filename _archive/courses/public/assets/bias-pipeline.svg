<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#F9FAFB"/>
  
  <!-- Pipeline Flow (Connecting Lines) -->
  <defs>
    <linearGradient id="pipeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.4"/>
    </linearGradient>
    
    <!-- Warning Icon Pattern -->
    <pattern id="warningPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="2" fill="#EF4444" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Flowing Pipeline Base -->
  <path d="M 50 200 L 750 200" stroke="url(#pipeGradient)" stroke-width="60" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Stage 1: Data Collection (Left) -->
  <g id="stage1">
    <!-- Stage Container -->
    <rect x="40" y="120" width="200" height="160" rx="16" fill="white" stroke="#3B82F6" stroke-width="3" opacity="0.95"/>
    
    <!-- Data Icon (Database/Documents) -->
    <g transform="translate(80, 145)">
      <!-- Documents/Data stack -->
      <rect x="0" y="20" width="50" height="60" rx="4" fill="#3B82F6" opacity="0.2"/>
      <rect x="10" y="10" width="50" height="60" rx="4" fill="#3B82F6" opacity="0.4"/>
      <rect x="20" y="0" width="50" height="60" rx="4" fill="#3B82F6" opacity="0.6"/>
      
      <!-- Data points -->
      <circle cx="35" cy="15" r="3" fill="white"/>
      <circle cx="45" cy="25" r="3" fill="white"/>
      <circle cx="55" cy="35" r="3" fill="white"/>
      <circle cx="30" cy="40" r="3" fill="white"/>
    </g>
    
    <!-- Stage Label -->
    <text x="140" y="255" text-anchor="middle" font-size="18" font-weight="bold" fill="#3B82F6">Data Collection</text>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(240, 190)">
    <path d="M 0 0 L 80 0" stroke="#8B5CF6" stroke-width="4" stroke-dasharray="8,4"/>
    <polygon points="80,0 70,-6 70,6" fill="#8B5CF6"/>
  </g>
  
  <!-- Stage 2: Model Training (Center) -->
  <g id="stage2">
    <!-- Stage Container -->
    <rect x="320" y="120" width="200" height="160" rx="16" fill="white" stroke="#8B5CF6" stroke-width="3" opacity="0.95"/>
    
    <!-- Brain/Network Icon -->
    <g transform="translate(360, 145)">
      <!-- Neural network representation -->
      <circle cx="30" cy="20" r="8" fill="#8B5CF6" opacity="0.3"/>
      <circle cx="70" cy="20" r="8" fill="#8B5CF6" opacity="0.3"/>
      <circle cx="110" cy="20" r="8" fill="#8B5CF6" opacity="0.3"/>
      
      <circle cx="50" cy="50" r="10" fill="#8B5CF6" opacity="0.5"/>
      <circle cx="90" cy="50" r="10" fill="#8B5CF6" opacity="0.5"/>
      
      <circle cx="70" cy="80" r="12" fill="#8B5CF6" opacity="0.7"/>
      
      <!-- Connections -->
      <line x1="30" y1="20" x2="50" y2="50" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
      <line x1="70" y1="20" x2="50" y2="50" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
      <line x1="110" y1="20" x2="90" y2="50" stroke="#8B5CF6" stroke-width="2" opacity="0.4"/>
      <line x1="50" y1="50" x2="70" y2="80" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
      <line x1="90" y1="50" x2="70" y2="80" stroke="#8B5CF6" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- Stage Label -->
    <text x="420" y="255" text-anchor="middle" font-size="18" font-weight="bold" fill="#8B5CF6">Model Training</text>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(520, 190)">
    <path d="M 0 0 L 80 0" stroke="#10B981" stroke-width="4" stroke-dasharray="8,4"/>
    <polygon points="80,0 70,-6 70,6" fill="#10B981"/>
  </g>
  
  <!-- Stage 3: Evaluation (Right) -->
  <g id="stage3">
    <!-- Stage Container -->
    <rect x="600" y="120" width="160" height="160" rx="16" fill="white" stroke="#10B981" stroke-width="3" opacity="0.95"/>
    
    <!-- Checkmark/Test Icon -->
    <g transform="translate(640, 145)">
      <!-- Clipboard/Evaluation -->
      <rect x="10" y="0" width="60" height="80" rx="4" fill="#10B981" opacity="0.2"/>
      <rect x="20" y="5" width="40" height="8" rx="2" fill="#10B981" opacity="0.4"/>
      
      <!-- Checkmarks and X marks (showing testing) -->
      <path d="M 25 25 L 30 30 L 40 20" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 25 40 L 30 45 L 40 35" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 25 55 L 35 65 M 35 55 L 25 65" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Stage Label -->
    <text x="680" y="255" text-anchor="middle" font-size="18" font-weight="bold" fill="#10B981">Evaluation</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1F2937">AI Development Pipeline</text>
  <text x="400" y="65" text-anchor="middle" font-size="16" fill="#6B7280">Click each stage to learn where bias can enter</text>
  
  <!-- Bottom Warning Bar -->
  <rect x="50" y="330" width="700" height="50" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2" opacity="0.8"/>
  <circle cx="80" cy="355" r="12" fill="#EF4444"/>
  <text x="76" y="361" font-size="16" font-weight="bold" fill="white">!</text>
  <text x="110" y="360" font-size="16" font-weight="600" fill="#991B1B">Bias can enter at any stage — Click the ! icons to explore</text>
</svg>

