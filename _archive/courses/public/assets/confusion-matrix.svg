<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="600" fill="#F9FAFB"/>
  
  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2937">Confusion Matrix</text>
  <text x="300" y="65" text-anchor="middle" font-size="14" fill="#6B7280">Predictions vs. Reality</text>
  
  <!-- Main Grid -->
  <g transform="translate(100, 120)">
    <!-- Column headers (Predicted) -->
    <text x="200" y="-30" text-anchor="middle" font-size="16" font-weight="bold" fill="#4B5563">PREDICTED</text>
    <text x="100" y="-5" text-anchor="middle" font-size="14" font-weight="600" fill="#10B981">Positive</text>
    <text x="300" y="-5" text-anchor="middle" font-size="14" font-weight="600" fill="#EF4444">Negative</text>
    
    <!-- Row headers (Actual) -->
    <text x="-80" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#4B5563" transform="rotate(-90, -80, 100)">ACTUAL</text>
    <text x="-30" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#10B981">Positive</text>
    <text x="-30" y="305" text-anchor="middle" font-size="14" font-weight="600" fill="#EF4444">Negative</text>
    
    <!-- TRUE POSITIVE (Top Left) -->
    <rect x="0" y="0" width="200" height="200" rx="12" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="3"/>
    <text x="100" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#065F46">TRUE</text>
    <text x="100" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#065F46">POSITIVE</text>
    <text x="100" y="135" text-anchor="middle" font-size="50">✓</text>
    <text x="100" y="175" text-anchor="middle" font-size="12" fill="#065F46" font-weight="600">Correctly detected</text>
    
    <!-- FALSE POSITIVE (Top Right) -->
    <rect x="200" y="0" width="200" height="200" rx="12" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="3"/>
    <text x="300" y="80" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400E">FALSE</text>
    <text x="300" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400E">POSITIVE</text>
    <text x="300" y="135" text-anchor="middle" font-size="50">⚠️</text>
    <text x="300" y="175" text-anchor="middle" font-size="12" fill="#92400E" font-weight="600">False alarm</text>
    
    <!-- FALSE NEGATIVE (Bottom Left) -->
    <rect x="0" y="200" width="200" height="200" rx="12" fill="#F59E0B" opacity="0.2" stroke="#F59E0B" stroke-width="3"/>
    <text x="100" y="280" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400E">FALSE</text>
    <text x="100" y="305" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400E">NEGATIVE</text>
    <text x="100" y="335" text-anchor="middle" font-size="50">❌</text>
    <text x="100" y="375" text-anchor="middle" font-size="12" fill="#92400E" font-weight="600">Missed case</text>
    
    <!-- TRUE NEGATIVE (Bottom Right) -->
    <rect x="200" y="200" width="200" height="200" rx="12" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="3"/>
    <text x="300" y="280" text-anchor="middle" font-size="20" font-weight="bold" fill="#065F46">TRUE</text>
    <text x="300" y="305" text-anchor="middle" font-size="20" font-weight="bold" fill="#065F46">NEGATIVE</text>
    <text x="300" y="335" text-anchor="middle" font-size="50">✓</text>
    <text x="300" y="375" text-anchor="middle" font-size="12" fill="#065F46" font-weight="600">Correctly rejected</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="400" height="60" rx="10" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
    <circle cx="20" cy="20" r="8" fill="#10B981"/>
    <text x="35" y="25" font-size="13" font-weight="600" fill="#1F2937">Green = Correct predictions (TP, TN)</text>
    <circle cx="20" cy="45" r="8" fill="#F59E0B"/>
    <text x="35" y="50" font-size="13" font-weight="600" fill="#1F2937">Orange = Errors (FP, FN)</text>
  </g>
</svg>

