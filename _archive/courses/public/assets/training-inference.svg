<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#F9FAFB"/>
  
  <!-- STAGE 1: TRAINING -->
  <g id="training">
    <!-- Container -->
    <rect x="40" y="60" width="320" height="300" rx="20" fill="white" stroke="#3B82F6" stroke-width="4"/>
    
    <!-- Title -->
    <text x="200" y="110" text-anchor="middle" font-size="32" font-weight="bold" fill="#3B82F6">TRAINING</text>
    
    <!-- Visual: Multiple examples going into a box -->
    <g transform="translate(200, 200)">
      <!-- Examples -->
      <text x="-80" y="-20" font-size="40">🐱</text>
      <text x="-80" y="30" font-size="40">🐕</text>
      <text x="-80" y="80" font-size="40">🐦</text>
      
      <!-- Arrows -->
      <path d="M -30 0 L 0 0" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrowBlue)"/>
      <path d="M -30 45 L 0 20" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrowBlue)"/>
      <path d="M -30 90 L 0 40" stroke="#3B82F6" stroke-width="3" marker-end="url(#arrowBlue)"/>
      
      <!-- Model box learning -->
      <rect x="0" y="-10" width="80" height="70" rx="12" fill="#3B82F6" opacity="0.2" stroke="#3B82F6" stroke-width="3"/>
      <text x="40" y="30" text-anchor="middle" font-size="36">📚</text>
    </g>
    
    <!-- Label -->
    <text x="200" y="310" text-anchor="middle" font-size="18" fill="#6B7280" font-weight="600">Learning patterns</text>
  </g>
  
  <!-- BIG ARROW -->
  <g transform="translate(360, 210)">
    <path d="M 0 0 L 90 0" stroke="#8B5CF6" stroke-width="6" marker-end="url(#arrowBigPurple)"/>
  </g>
  
  <!-- STAGE 2: FREEZE -->
  <g id="freeze">
    <!-- Container -->
    <rect x="450" y="60" width="280" height="300" rx="20" fill="white" stroke="#8B5CF6" stroke-width="4"/>
    
    <!-- Title -->
    <text x="590" y="110" text-anchor="middle" font-size="32" font-weight="bold" fill="#8B5CF6">FREEZE</text>
    
    <!-- Visual: Lock -->
    <g transform="translate(590, 210)">
      <circle cx="0" cy="0" r="60" fill="#8B5CF6" opacity="0.2"/>
      <text x="0" y="25" text-anchor="middle" font-size="80">🔒</text>
    </g>
    
    <!-- Label -->
    <text x="590" y="310" text-anchor="middle" font-size="18" fill="#6B7280" font-weight="600">Save knowledge</text>
  </g>
  
  <!-- BIG ARROW -->
  <g transform="translate(730, 210)">
    <path d="M 0 0 L 90 0" stroke="#10B981" stroke-width="6" marker-end="url(#arrowBigGreen)"/>
  </g>
  
  <!-- STAGE 3: INFERENCE -->
  <g id="inference">
    <!-- Container -->
    <rect x="820" y="60" width="340" height="300" rx="20" fill="white" stroke="#10B981" stroke-width="4"/>
    
    <!-- Title -->
    <text x="990" y="110" text-anchor="middle" font-size="32" font-weight="bold" fill="#10B981">INFERENCE</text>
    
    <!-- Visual: Question mark in, answer out -->
    <g transform="translate(990, 210)">
      <!-- Input -->
      <text x="-100" y="15" font-size="50">❓</text>
      
      <!-- Arrow in -->
      <path d="M -40 0 L -10 0" stroke="#10B981" stroke-width="4" marker-end="url(#arrowGreen)"/>
      
      <!-- Model (locked) -->
      <rect x="-30" y="-30" width="60" height="60" rx="10" fill="#10B981"/>
      <text x="0" y="10" text-anchor="middle" font-size="32" fill="white">🔒</text>
      
      <!-- Arrow out with lightning -->
      <path d="M 30 0 L 60 0" stroke="#10B981" stroke-width="4" marker-end="url(#arrowGreen)"/>
      <text x="45" y="-15" text-anchor="middle" font-size="20">⚡</text>
      
      <!-- Output -->
      <text x="100" y="15" font-size="50">🐱</text>
    </g>
    
    <!-- Label -->
    <text x="990" y="310" text-anchor="middle" font-size="18" fill="#6B7280" font-weight="600">Fast predictions</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#3B82F6"/>
    </marker>
    <marker id="arrowBigPurple" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <polygon points="0,0 16,8 0,16" fill="#8B5CF6"/>
    </marker>
    <marker id="arrowBigGreen" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto">
      <polygon points="0,0 16,8 0,16" fill="#10B981"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#10B981"/>
    </marker>
  </defs>
</svg>
